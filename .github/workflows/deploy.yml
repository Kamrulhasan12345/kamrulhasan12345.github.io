name: Deploy to GitHub Pages

# Build on every PR (as a status check) and every push to master; deploy only from master.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# default to no permissions; each job asks for what it needs
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # a new push to the same PR cancels the stale build; master builds always finish
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # gives the site's real origin (github.io or a custom domain) without hard-coding it
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # `npm run build` = astro check (types) + astro build
      - run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # one deployment at a time; never cancel one halfway
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
