# Weekly version updates. Each PR is built by the deploy workflow before you merge it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # minor + patch bumps land as one PR; majors (e.g. Astro 6) stay separate
      minor-and-patch:
        update-types: [minor, patch]
